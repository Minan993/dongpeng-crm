services:
  nginx:
    image: nginx:1.27-alpine
    container_name: dongpeng-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

  web:
    build:
      context: ./web
    container_name: dongpeng-web
    restart: always

  api:
    build:
      context: ./api
    container_name: dongpeng-api
    restart: always
    environment:
      TZ: Asia/Shanghai
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: 123
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: dongpeng-db
    restart: always
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
